services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.evolution
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances

  bot:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      evolution-api:
        condition: service_started
    env_file: .env.bot
    command: sh -c "npm install --omit=dev && npm start"
    volumes:
      - .:/app
      - bot_node_modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.evolution
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
  bot_node_modules:
