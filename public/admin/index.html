<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes | Kazu</title><style>body{font:16px system-ui;margin:2rem;background:#fafafa;color:#18201c}main{max-width:1000px;margin:auto}button{padding:.6rem .9rem}table{width:100%;border-collapse:collapse;background:white;margin-top:1rem}th,td{padding:.7rem;text-align:left;border-bottom:1px solid #ddd}th{background:#e9f5ed}@media(max-width:650px){table,thead,tbody,tr,td{display:block}thead{display:none}td:before{content:attr(data-label);font-weight:700;display:block}tr{border:1px solid #ddd;margin-bottom:1rem}}</style></head><body><main><h1>Solicitudes de tutoría</h1><p id="status">Cargando…</p><button id="reload">Actualizar</button> <button id="backup">Crear copia ahora</button><table><thead><tr><th>Estudiante</th><th>Contacto</th><th>Tema</th><th>Horario</th><th>Estado</th><th>Calendario</th></tr></thead><tbody id="rows"></tbody></table></main><script>const status=document.querySelector('#status'),rows=document.querySelector('#rows');const value=v=>v||'—',esc=v=>String(value(v)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){status.textContent='Cargando…';try{const r=await fetch('/api/admin/requests');const d=await r.json();if(!r.ok)throw Error(d.error);rows.innerHTML=d.requests.map(x=>`<tr><td data-label="Estudiante">${esc(x.name)}</td><td data-label="Contacto">${esc(value(x.contact).replace('@s.whatsapp.net',''))}</td><td data-label="Tema">${esc(x.need)}</td><td data-label="Horario">${esc(x.availability)}</td><td data-label="Estado">${x.confirmed?'Confirmada':'En curso'}</td><td data-label="Calendario">${x.calendar_event_id?'Creado':'Pendiente'}</td></tr>`).join('');status.textContent=`${d.requests.length} solicitudes`; }catch(e){status.textContent=e.message}}document.querySelector('#reload').onclick=load;document.querySelector('#backup').onclick=async()=>{const r=await fetch('/api/admin/backup',{method:'POST'}),d=await r.json();status.textContent=r.ok?`Copia creada (${d.requests} solicitudes).`:d.error};load();</script></body></html>
